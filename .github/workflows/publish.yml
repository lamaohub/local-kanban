name: publish

# Publishing by hand from a laptop is how the wrong thing gets published: a stale working tree,
# a version that does not match the tag, a green test run from yesterday. The tag is the trigger,
# and the tag is what the release script pushes.
#
# Publishing is authorised by a trusted publisher on npm (Settings -> Trusted Publisher -> GitHub
# Actions, this repository, this filename), not by a token. Until that trust exists the workflow
# simply fails at the last step, which is the honest outcome — nothing half-published.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance is signed with this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: node --test

      - name: the tag and package.json must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg — one of them is wrong"
            exit 1
          }

      # CK-385: the same install check the test workflow runs. It was not called here at all, so
      # the one thing that must never be published broken — a package that installs but does not
      # open — had no gate on the publishing path. Nothing half-published: this runs before the
      # irreversible step, not after it.
      - name: pack, install and open the package
        run: |
          set -euo pipefail
          tgz=$(npm pack --silent | tail -1)
          npm install -g --prefix "$RUNNER_TEMP/prefix" "./$tgz"

          "$RUNNER_TEMP/prefix/bin/local-kanban" start --port 3199 --data "$RUNNER_TEMP/data" &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/api/projects >/dev/null 2>&1; then up=1; break; fi
            sleep 0.5
          done
          test "${up:-}" = 1 || { echo "the installed package never answered"; kill -9 "$pid"; exit 1; }
          for path in / /app.js /js/core.js /style.css; do
            curl -fsS "http://127.0.0.1:3199$path" >/dev/null \
              || { echo "the board serves the API but not $path"; kill -9 "$pid"; exit 1; }
          done
          curl -fsS http://127.0.0.1:3199/ | grep -q '<div id="board"' \
            || { echo "the page came back without the board markup"; kill -9 "$pid"; exit 1; }
          kill "$pid" || true

      # Trusted publishing (OIDC): npm trusts this workflow in this repository, so there is no token
      # to leak, rotate or lose. It arrived in a later npm than the runner ships, hence the upgrade.
      #
      # A token in NODE_AUTH_TOKEN would WIN over the trust: npm authenticates with whatever it finds
      # and never reaches for OIDC — which is how a configured trusted publisher can still fail with
      # "this operation requires a one-time password". So there is deliberately no env here, and the
      # NPM_TOKEN secret is deleted rather than kept "just in case".
      - run: npm install -g npm@latest
      - run: npm publish --access public --provenance
