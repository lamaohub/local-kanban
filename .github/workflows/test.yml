name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test

  # What a stranger runs is not this repository but a package: dependencies come from the
  # lockfile, the contents from `files`, the entry points from `bin`. Both failures this project
  # actually shipped lived in that gap — a board with nothing to start it, and data written
  # inside the package directory — and a green test run said nothing about either.
  #
  # On the current LTS, because that is what a stranger installing today gets. The database
  # driver is a native module and ships prebuilt binaries per Node ABI: a version with no
  # prebuild does not fail here, it silently falls back to compiling from source, which needs a
  # toolchain the machine may not have. Testing only the version the author happens to run is how
  # that goes unnoticed.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: pack, install and boot the package
        run: |
          set -euo pipefail
          tgz=$(npm pack --silent | tail -1)
          npm install -g --prefix "$RUNNER_TEMP/prefix" "./$tgz"

          "$RUNNER_TEMP/prefix/bin/local-kanban" start --port 3199 --data "$RUNNER_TEMP/data" &
          pid=$!

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/api/projects >/dev/null 2>&1; then up=1; break; fi
            sleep 0.5
          done
          test "${up:-}" = 1 || { echo "the installed package never answered"; kill -9 "$pid"; exit 1; }

          # CK-385: the API answering is NOT the board opening. A package built without public/
          # — the exact breakage this job exists to catch — still answers 200 on /api/projects,
          # while the page itself is a 404 and the server only prints one warn-level line that
          # nothing here reads. So ask for the page and the entry point too.
          for path in / /app.js /js/core.js /style.css; do
            curl -fsS "http://127.0.0.1:3199$path" >/dev/null \
              || { echo "the board serves the API but not $path"; kill -9 "$pid"; exit 1; }
          done
          curl -fsS http://127.0.0.1:3199/ | grep -q '<div id="board"' \
            || { echo "the page came back without the board markup"; kill -9 "$pid"; exit 1; }

          # and it must also stop the way a person stops it: a listener registered on import once
          # cancelled Node's default terminate, and the board survived both Ctrl+C and SIGTERM
          kill "$pid"
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || { stopped=1; break; }
            sleep 0.5
          done
          test "${stopped:-}" = 1 || { echo "the board ignored SIGTERM"; kill -9 "$pid"; exit 1; }
