<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Kanban</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1f1f1e; color: #e8e6e3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { text-align: center; max-width: 320px; padding: 32px; }
  .logo { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { color: #9b9690; margin: 0 0 20px; }
  button {
    font: inherit; color: #fff; background: #e8704e; border: 0;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
  }
  button:hover { filter: brightness(1.07); }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="7" fill="#e8704e"/>
      <rect x="6" y="7" width="5.5" height="12" rx="2" fill="#fff" opacity=".95"/>
      <rect x="13.25" y="7" width="5.5" height="18" rx="2" fill="#fff" opacity=".95"/>
      <rect x="20.5" y="7" width="5.5" height="8" rx="2" fill="#fff" opacity=".95"/>
    </svg>
    <h1>No connection to the board</h1>
    <p>The kanban server is not responding. It may be restarting, or the computer running it is off. The board will load as soon as the connection is back.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
